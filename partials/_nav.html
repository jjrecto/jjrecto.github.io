<!--
  _nav.html — Shared navigation
  ============================================================
  Usage notes:
  - On index.html  : logo href="#hero",  links use "#services" / "#work" / "#about" / "#contact"
  - On other pages : logo href="index.html", links use "index.html#services" etc.
  - Active page link: add class "text-accent" to the matching <a> and remove the hover classes.
  - Alpine state required in the parent x-data: { dark, mm, sc, s }
    (index.html uses `app()`; other pages declare their own function)
  ============================================================
-->

<header class="fixed inset-x-0 top-0 z-50 transition-all duration-300"
  :class="sc ? 'bg-white/90 dark:bg-zinc-950/90 backdrop-blur-md shadow-sm shadow-black/5' : ''">

  <nav class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between" aria-label="Main navigation">

    <!-- ── Logo ── -->
    <a href="index.html" class="font-display font-bold text-xl tracking-tight relative z-10">
      <span class="text-zinc-900 dark:text-white">jon</span><span class="text-accent">jeous</span>
    </a>

    <!-- ── Desktop links ── -->
    <ul class="hidden md:flex items-center gap-8 text-sm" role="list">
      <li><a href="index.html#services" class="nl text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors">Services</a></li>
      <li><a href="projects.html"       class="nl text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors">Work</a></li>
      <li><a href="index.html#about"    class="nl text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors">About</a></li>
      <li><a href="index.html#contact"  class="nl text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition-colors">Contact</a></li>
    </ul>

    <!-- ── Controls ── -->
    <div class="flex items-center gap-3">

      <!-- Dark mode toggle -->
      <button @click="dark=!dark"
        class="w-9 h-9 flex items-center justify-center rounded-full border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition-colors"
        :aria-label="dark ? 'Light mode' : 'Dark mode'">
        <svg x-show="!dark" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
        <svg x-show="dark" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
        </svg>
      </button>

      <!-- Hire me (desktop) -->
      <a href="index.html#contact"
        class="hidden md:inline-flex items-center gap-2 shimmer bg-accent text-white text-sm font-medium px-5 py-2 rounded-full hover:bg-accent-light transition-colors">
        Hire me
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
        </svg>
      </a>

      <!-- Hamburger -->
      <button @click="mm=!mm"
        class="md:hidden w-9 h-9 flex items-center justify-center rounded-full border border-zinc-200 dark:border-zinc-800"
        :aria-expanded="mm" aria-label="Toggle menu">
        <svg x-show="!mm" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg x-show="mm" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

    </div>
  </nav>

  <!-- ── Mobile menu ── -->
  <div x-show="mm" x-cloak
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 -translate-y-2"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 -translate-y-2"
    class="md:hidden bg-white dark:bg-zinc-950 border-t border-zinc-100 dark:border-zinc-900">
    <ul class="flex flex-col px-6 py-5 gap-4 text-sm font-medium" role="list">
      <li><a href="index.html#services" @click="mm=false" class="block text-zinc-700 dark:text-zinc-300 hover:text-accent transition-colors">Services</a></li>
      <li><a href="projects.html"       @click="mm=false" class="block text-zinc-700 dark:text-zinc-300 hover:text-accent transition-colors">Work</a></li>
      <li><a href="index.html#about"    @click="mm=false" class="block text-zinc-700 dark:text-zinc-300 hover:text-accent transition-colors">About</a></li>
      <li><a href="index.html#contact"  @click="mm=false" class="block text-zinc-700 dark:text-zinc-300 hover:text-accent transition-colors">Contact</a></li>
      <li class="pt-2 border-t border-zinc-100 dark:border-zinc-900">
        <a href="index.html#contact" @click="mm=false"
          class="inline-flex shimmer bg-accent text-white font-medium text-sm px-5 py-2.5 rounded-full">Hire me →</a>
      </li>
    </ul>
  </div>

</header>
